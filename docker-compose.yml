name: lmlog

services:
  # One-shot: generates synthetic logs into the shared `logs` volume.
  generator:
    build: .
    image: lmlog:local
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    command:
      - generate
      - --out
      - /data/logs
      - --lines
      - ${LMLOG_DEMO_LINES:-200000}
      - --days
      - ${LMLOG_DEMO_DAYS:-1}
      - --profile
      - demo
    volumes:
      - logs:/data/logs

  # On-demand CLI: `docker compose run --rm lmlog <command>`
  lmlog:
    build: .
    image: lmlog:local
    command: ["--help"]
    restart: "no"
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    environment:
      LMLOG_DB: /state/lmlog.db
      LMLOG_LOG_DIR: /data/logs
      LMLOG_LLM_MODE: ${LMLOG_LLM_MODE:-direct}
      OLLAMA_HOST: ${OLLAMA_HOST:-ollama:11434}
      LMLOG_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    volumes:
      - logs:/data/logs
      - state:/state

  # Long-running: keeps the snapshot fresh with incremental ingests.
  daemon:
    build: .
    image: lmlog:local
    profiles: ["daemon"]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    command:
      - daemon
      - --foreground
      - --interval
      - ${LMLOG_DAEMON_INTERVAL:-300}
    restart: unless-stopped
    environment:
      LMLOG_DB: /state/lmlog.db
      LMLOG_LOG_DIR: /data/logs
      LMLOG_LLM_MODE: ${LMLOG_LLM_MODE:-direct}
      OLLAMA_HOST: ${OLLAMA_HOST:-ollama:11434}
      LMLOG_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    volumes:
      - logs:/data/logs
      - state:/state
    depends_on:
      generator:
        condition: service_completed_successfully

  # Optional HTTP API: `make serve` or `docker compose --profile serve up -d serve`.
  serve:
    build:
      context: .
      args:
        INSTALL_SERVE: "true"
    image: lmlog:serve
    profiles: ["serve"]
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 512
    command:
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "8090"
    restart: unless-stopped
    environment:
      LMLOG_API_TOKEN: ${LMLOG_API_TOKEN:?set LMLOG_API_TOKEN in .env}
      LMLOG_SERVE_DATA_DIR: /serve
      LMLOG_SERVE_MAX_UPLOAD_MB: ${LMLOG_SERVE_MAX_UPLOAD_MB:-50}
      LMLOG_LLM_MODE: ${LMLOG_LLM_MODE:-direct}
      OLLAMA_HOST: ${OLLAMA_HOST:-ollama:11434}
      LMLOG_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    ports:
      - "127.0.0.1:${LMLOG_SERVE_PORT:-8090}:8090"
    volumes:
      - serve:/serve
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Optional standalone-dev LLM. Full-stack deployments use infra/ instead.
  ollama:
    image: ollama/ollama:0.40.16@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
    profiles: ["ai", "llm"]
    mem_limit: 8g
    cpus: 6.0
    pids_limit: 512
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "5m"
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

  # One-shot model pull. The model is never baked into the image.
  ollama-pull:
    image: ollama/ollama:0.40.16@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
    profiles: ["ai", "llm"]
    restart: "no"
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-qwen2.5:3b}"]
    volumes:
      - ollama:/root/.ollama

volumes:
  logs:
  state:
  serve:
  ollama:
