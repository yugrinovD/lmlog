[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lmlog"
version = "0.1.0"
description = "Local, CPU-first log intelligence: signatures, errors, trends and explanations for very large log volumes."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["logs", "observability", "anomaly-detection", "llm", "ollama", "devops"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: System :: Logging",
]
dependencies = []

[project.optional-dependencies]
fast = ["orjson>=3.9"]
serve = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
    "httpx>=0.27",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
]

[project.scripts]
lmlog = "lmlog.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.coverage.run]
source = ["lmlog"]
